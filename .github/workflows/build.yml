name: Build Flutter APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          
      - run: flutter create . --platforms=android --project-name=my_app
      
      - name: Generate Permanent Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass secretpassword -keypass secretpassword -dname "CN=MyApp, O=Dev, C=UA"
          
      - name: Inject Signing Config into Gradle
        run: |
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()
          
          target = 'android {'
          replacement = '''android {
              signingConfigs {
                  release {
                      storeFile file(\"release.jks\")
                      storePassword \"secretpassword\"
                      keyAlias \"mykey\"
                      keyPassword \"secretpassword\"
                  }
              }'''
          content = content.replace(target, replacement, 1)
          content = content.replace('buildTypes {', 'buildTypes {\n        release { signingConfig signingConfigs.release }', 1)
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          "
          
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
